# Puts a build of develop on dev: its Windows and macOS files replace the
# rolling `dev` pre-release, dev's own signaling is rebuilt from that build's
# server/, and its web build replaces https://dev.za-company.mayar-deeb.dev.
#
# It BUILDS nothing. Every Release run on develop builds dev builds and keeps
# them for a week (release.yml); this takes one of those runs' files and ships
# them, so a build that went green never has to be built again to reach dev.
# Two ways in:
#
# - Actions -> Deploy dev -> Run workflow, on develop: the newest build of
#   develop that went green, or the run named in the box (its number or URL).
# - Release's own "Deploy to dev" box: release.yml calls this after its
#   builds, with its own run.
#
# Never on its own, for the reason release.yml gives. Nothing a release owns
# moves: not the live site, its signaling, Caddy or coturn, not a version
# number. RELEASING.md, Deploying to dev.

name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      run:
        description: "The Release run to deploy, by number or URL (blank: the newest green build of develop)"
        type: string
        required: false
  workflow_call:
    inputs:
      run:
        type: string
        required: true
    secrets:
      DEPLOY_SSH_KEY:
        required: false

permissions:
  contents: write  # the dev pre-release and its tag
  actions: read    # another run's files

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      sha: ${{ steps.pick.outputs.sha }}
      subject: ${{ steps.pick.outputs.subject }}
      foreign: ${{ steps.pick.outputs.foreign }}
    steps:
      - name: Which build goes to dev
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ inputs.run }}
        run: |
          # develop and nothing else: GitHub offers Run workflow on every
          # branch and tag, and this run's checkout is what loads the deploy key.
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Run this from develop, not ${GITHUB_REF#refs/*/} (RELEASING.md, Deploying to dev)."
            exit 1
          fi

          if [ "$RUN" = "$GITHUB_RUN_ID" ]; then
            # Called by release.yml after its own builds, which its needs:
            # already gated. Its files are this run's, fetched the usual way.
            sha="$GITHUB_SHA"
            foreign=false
          else
            foreign=true
            # A pasted URL is as good as the number in it.
            RUN="$(sed -E 's#.*/runs/([0-9]+).*#\1#' <<< "$RUN")"
            runs="repos/$GH_REPO/actions/workflows/release.yml/runs?branch=develop&per_page=1"
            if [ -z "$RUN" ]; then
              RUN="$(gh api "$runs&status=success" --jq '.workflow_runs[0].id // empty')"
              if [ -z "$RUN" ]; then
                echo "::error::No Release run on develop has gone green yet: run Release on develop, then this."
                exit 1
              fi
            fi
            if ! [[ "$RUN" =~ ^[0-9]+$ ]]; then
              echo "::error::'$RUN' is not a run: give the number from a Release run's URL, or leave it blank."
              exit 1
            fi

            release_id="$(gh api "repos/$GH_REPO/actions/workflows/release.yml" --jq .id)"
            info="$(gh api "repos/$GH_REPO/actions/runs/$RUN" \
              --jq '"\(.workflow_id) \(.head_branch) \(.conclusion // .status) \(.head_sha)"')" || {
              echo "::error::There is no run $RUN in this repository."
              exit 1
            }
            read -r workflow branch conclusion sha <<< "$info"
            if [ "$workflow" != "$release_id" ] || [ "$branch" != develop ]; then
              echo "::error::Run $RUN is not a Release run on develop, and only those build dev builds."
              exit 1
            fi
            # Every build gates a deploy to dev, here as in release.yml.
            if [ "$conclusion" != success ]; then
              echo "::error::Run $RUN did not go green ($conclusion), so nothing of it is deployed."
              exit 1
            fi
            # A week, then the files are gone: say so now, before anything moves.
            have=" $(gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            for name in windows macos web server; do
              if [[ "$have" != *" $name "* ]]; then
                echo "::error::Run $RUN's '$name' files are gone (a develop build keeps them a week): run Release on develop again."
                exit 1
              fi
            done

            # Two warnings, never a refusal: an older build is a choice someone
            # can make, and neither question failing stops the deploy.
            newest="$(gh api "$runs" --jq '.workflow_runs[0] | "\(.id) \(.head_sha[0:7]) \(.conclusion // .status)"')" || newest="$RUN"
            if [ "${newest%% *}" != "$RUN" ]; then
              echo "::warning::Run $RUN is not develop's newest build: that is run $newest. Dev gets the older one."
            fi
            # Most pushes to develop build nothing (release.yml's paths), so the
            # newest build can be well behind the branch. Say how far.
            ahead="$(gh api "repos/$GH_REPO/compare/$sha...develop" --jq .ahead_by)" || ahead=0
            if [ "$ahead" != 0 ]; then
              echo "::warning::develop is $ahead commit(s) past this build (${sha:0:7}), and dev gets none of them. To ship develop as it is now: Release -> Run workflow on develop with Deploy to dev ticked."
            fi
          fi

          subject="$(gh api "repos/$GH_REPO/commits/$sha" --jq '.commit.message | split("\n")[0]')"
          {
            echo "run=$RUN"
            echo "sha=$sha"
            echo "subject=$subject"
            echo "foreign=$foreign"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying run $RUN (${sha:0:7}: $subject) to the dev pre-release and https://dev.za-company.mayar-deeb.dev"

  # The Windows and macOS files replace the rolling `dev` pre-release. One
  # release, its files always named `dev`, so each download link stays the same
  # from one dev build to the next. Marked pre-release and never latest, so
  # GitHub's "latest" - which is what the in-game update check asks for - is
  # always the real release.
  publish:
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: dev-publish
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ needs.plan.outputs.run }}
      SHA: ${{ needs.plan.outputs.sha }}
      SUBJECT: ${{ needs.plan.outputs.subject }}
    steps:
      - uses: actions/checkout@v7

      # Without a token the action reads THIS run's files; with one, the run
      # named - which is how a build from an earlier run gets here.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ needs.plan.outputs.foreign == 'true' && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ needs.plan.outputs.foreign == 'true' && github.token || '' }}

      - name: They are dev builds
        # A build from before develop built dev builds is the game itself -
        # its name, the live signaling - and must never be the dev pre-release.
        run: |
          for f in TheNewHire-dev-windows-setup.exe TheNewHire-dev-windows-portable.zip TheNewHire-dev-macos.dmg; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Run $RUN has no $f, so it built release files rather than dev builds: run Release on develop again."
              ls dist
              exit 1
            fi
          done

      # The same list a release carries, so the in-game updater can be tried
      # against this build with --update-feed=<this release's API URL>.
      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Replace the dev pre-release
        run: |
          {
            echo "**Not a release.** A build of \`develop\` at ${SHA:0:7}, for testing. The next dev deploy replaces it, and players are never offered it."
            echo
            echo "- Play it in a browser: https://dev.za-company.mayar-deeb.dev"
            echo "- Last change: $SUBJECT"
            echo "- Built by https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN, published $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "The builds are not signed - see a release's notes for what Windows and macOS ask the first time."
          } > notes.md
          cat notes.md
          # Delete and recreate rather than edit: the tag must move to this
          # commit, and a release whose tag is gone is a draft nobody sees.
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          # And a tag a half-finished earlier run left behind, which `create`
          # would otherwise reuse - at the old commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" 2>/dev/null || true
          gh release create dev dist/* --target "$SHA" --title "dev build" \
            --notes-file notes.md --prerelease --latest=false

  # Then dev's own signaling and the web build onto the dev site, in the
  # release's order: the server first, so a new game never meets an old
  # service. `server-dev` starts ONLY the signaling service from this build's
  # copy of server/, as a project of its own on its own port (server/README.md,
  # Dev's signaling); `web-dev` fills the dev site's own folder. Neither can
  # touch the live site, its signaling, Caddy or coturn, which stay the latest
  # release's.
  deploy:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dev-deploy
    environment:
      name: dev
      url: https://dev.za-company.mayar-deeb.dev
    env:
      HOST: za-company.mayar-deeb.dev
      DEV_SITE: https://dev.za-company.mayar-deeb.dev
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ needs.plan.outputs.foreign == 'true' && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server-bundle
          run-id: ${{ needs.plan.outputs.run }}
          github-token: ${{ needs.plan.outputs.foreign == 'true' && github.token || '' }}

      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash tools/release/load_deploy_key.sh

      - name: Dev's signaling first
        run: $SSH server-dev < server-bundle/server.tar

      - name: Then the dev site
        run: tar -C web -cf - . | $SSH web-dev

      - name: Check it is live
        # "ok dev" and not merely "ok": the live service answers the same path,
        # and only the word proves the dev site reaches dev's own copy.
        run: |
          health=$(curl -fsS --retry 5 --retry-delay 3 "$DEV_SITE/healthz")
          [ "$health" = "ok dev" ] || { echo "::error::$DEV_SITE/healthz said '$health', not 'ok dev'"; exit 1; }
          curl -fsS "$DEV_SITE/" -o live.html
          cmp live.html web/index.html
          echo "::notice::${SHA:0:7} is live at $DEV_SITE, on dev's own signaling"
