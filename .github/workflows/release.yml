# A release is a change to VERSION reaching main, and nothing else is.
#
# Pushing and merging into main is ordinary work and publishes nothing. The day
# VERSION changes on main, this builds the game for Windows (an installer and a
# portable zip) and macOS (a disk image), tags the commit v<VERSION> and
# publishes a GitHub Release carrying all three, with every commit since the
# last release as its notes. Nothing is published unless every build worked -
# and that includes the web build and the server's checks, which are not on
# the Release page but go out with it: once the Release exists, the deploy job
# brings the server's stack up to this commit and puts the web build live at
# https://za-company.mayar-deeb.dev. The site is always the latest release.
#
# On develop it is a DRY RUN: a push there that touches what the builds are
# made of (the presets, this file, tools/release/) builds everything and keeps
# the files on the run's page for a week, and publishes nothing. That is how a
# packaging change is tried without spending a version number on it. A push
# that touches server/ is not one: server.yml gives it the server's checks
# alone, the same ones the `server` job below runs, without building the game.
#
# DEPLOY TO DEV is the same run started by hand on develop with its box ticked
# (never on its own: develop takes too many half-finished pushes). The same
# builds gate it the same way, and then the Windows and macOS files replace the
# rolling `dev` pre-release - one stable link per file, never "latest", so no
# player or in-game update check is ever offered it - dev's own signaling
# service is rebuilt from this commit's server/, and the web build replaces
# https://dev.za-company.mayar-deeb.dev. The builds carry the `dev` feature
# tag, so a dev desktop build talks to dev's signaling too. Nothing a release
# owns moves: not the live site, not its signaling, Caddy or coturn, not a
# version number.
#
# The rest of the flow (develop -> main, bumping the number) is RELEASING.md.

name: Release

on:
  push:
    branches: [main, develop]
    paths:
      - VERSION
      - export_presets.cfg
      - .github/workflows/release.yml
      - tools/release/**
  # Re-run by hand from the Actions tab: on main it releases if VERSION is not
  # out yet (and stops at "already released" if it is); on develop it is a dry
  # run - or, with the box ticked, a deploy to dev. Any other branch or a tag
  # is refused: GitHub lists them all in "Use workflow from" and offers the box
  # on every one, and there is no way to hide either, so the plan job says no.
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: "Deploy to dev: replace the dev pre-release and the dev site (develop only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      core: ${{ steps.plan.outputs.core }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every tag, for the checks below

      - name: Read VERSION and decide what this run is
        id: plan
        env:
          DEPLOY_DEV: ${{ inputs.deploy_dev }}
        run: |
          # main or develop and nothing else - not an old branch, not a tag,
          # where the box would put that old code on the dev site.
          case "$GITHUB_REF" in
            refs/heads/main | refs/heads/develop) ;;
            *)
              echo "::error::Run this from main (a release) or develop (a dry run or a deploy to dev), not ${GITHUB_REF#refs/*/} (RELEASING.md)."
              exit 1
              ;;
          esac
          version="$(tr -d ' \t\r\n' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not MAJOR.MINOR.PATCH (optionally -suffix, e.g. 1.2.0-beta.1)"
            exit 1
          fi
          tag="v$version"
          core="${version%%-*}"
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"

          dev=false
          if [ "$DEPLOY_DEV" = "true" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Deploy to dev builds develop, not main: on main a release is a VERSION change (RELEASING.md)."
              exit 1
            fi
            dev=true
          fi
          {
            # A dev build's files are named `dev` rather than a number, so the
            # rolling pre-release's download links never change. Its numeric
            # core still stamps the exe and the .app.
            if $dev; then echo "version=dev"; else echo "version=$version"; fi
            echo "core=$core"
            echo "tag=$tag"
            echo "previous=$latest"
            [[ "$version" == *-* ]] && echo "prerelease=true" || echo "prerelease=false"
          } >> "$GITHUB_OUTPUT"

          if $dev; then
            echo "::notice::Deploy to dev from ${GITHUB_REF#refs/heads/} at ${GITHUB_SHA:0:7}: the dev pre-release and https://dev.za-company.mayar-deeb.dev"
            echo "mode=dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Dry run on ${GITHUB_REF#refs/heads/}: building $version, publishing nothing"
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already released - nothing to do"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A lower number than one already out is a typo, not a release.
          # Compared on MAJOR.MINOR.PATCH alone: sort -V ranks 1.0.0 BELOW
          # 1.0.0-rc.1, which is backwards for releasing 1.0.0 after its rc.
          if [ -n "$latest" ]; then
            core_old="${latest#v}"; core_old="${core_old%%-*}"
            top="$(printf '%s\n%s\n' "$core_old" "$core" | sort -V | tail -n1)"
            if [ "$core" != "$core_old" ] && [ "$top" != "$core" ]; then
              echo "::error file=VERSION::$version is lower than the latest release $latest"
              exit 1
            fi
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CORE: ${{ needs.plan.outputs.core }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-windows-v1

      - name: Fetch Godot and the Windows template
        run: echo "GODOT=$(bash tools/release/fetch_godot.sh windows ~/godot-cache)" >> "$GITHUB_ENV"

      - name: Stamp the version and import
        run: bash tools/release/prepare.sh "$GODOT" "$CORE" "$MODE"

      - name: Export
        run: bash tools/release/export.sh "$GODOT" "Windows Desktop" build/windows/TheNewHire.exe

      - name: The WebRTC library is in it
        # Without it the game plays solo and cannot play online, and nothing
        # else in the build would say so.
        run: bash tools/release/check_plugin.sh windows build/windows

      - name: Licences beside the binaries
        # The WebRTC library ships next to the exe, so its licences do too
        # (CREDITS.md). They are also inside the game's data on both platforms.
        run: |
          mkdir -p build/windows/licenses
          cp addons/webrtc_native/LICENSE.* build/windows/licenses/

      - name: Portable zip
        # A dev build unzips to a folder of its own name, so it never lands on
        # top of an unzipped copy of the game (prepare.sh renamed what is in it).
        run: |
          app="The New Hire"
          if [ "$MODE" = dev ]; then app="The New Hire (dev)"; fi
          mkdir -p dist "stage/$app"
          cp -R build/windows/. "stage/$app/"
          (cd stage && 7z a -tzip "../dist/TheNewHire-${VERSION}-windows-portable.zip" "$app" >/dev/null)

      - name: Installer
        shell: pwsh
        # /DDev: a dev build installs beside the game, never over it (installer.iss).
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $dev = @()
          if ($env:MODE -eq 'dev') { $dev = @('/DDev') }
          & $iscc /Q @dev "/DAppVersion=$env:VERSION" "/DFileVersion=$env:CORE" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\build\windows" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" tools\release\installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Inno Setup failed ($LASTEXITCODE)"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  macos:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CORE: ${{ needs.plan.outputs.core }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-macos-v1

      - name: Fetch Godot and the macOS template
        run: echo "GODOT=$(bash tools/release/fetch_godot.sh macos ~/godot-cache)" >> "$GITHUB_ENV"

      - name: Stamp the version and import
        run: bash tools/release/prepare.sh "$GODOT" "$CORE" "$MODE"

      - name: Export the disk image
        run: |
          bash tools/release/export.sh "$GODOT" "macOS" build/macos/TheNewHire.dmg
          mkdir -p dist
          cp build/macos/TheNewHire.dmg "dist/TheNewHire-${VERSION}-macos.dmg"

      - name: The WebRTC library is in it
        run: bash tools/release/check_plugin.sh macos build/macos/TheNewHire.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  # The browser build. Not attached to the Release: the deploy job puts it on
  # the server, which is the only place anybody plays it.
  web:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE: ${{ needs.plan.outputs.core }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Fetch Godot and the web template
        run: echo "GODOT=$(bash tools/release/fetch_godot.sh web ~/godot-cache)" >> "$GITHUB_ENV"

      - name: Stamp the version and import
        run: bash tools/release/prepare.sh "$GODOT" "$CORE" "$MODE"

      - name: Export
        run: bash tools/release/export.sh "$GODOT" "Web" build/web/index.html

      - name: Compress
        # The server sends the .gz files as they are (Caddy's `precompressed
        # gzip`) and compresses nothing itself: one core cannot afford a second
        # of CPU per player. 54 MB of build is about 23 MB on the wire.
        run: |
          gzip -9 -k -n build/web/*.html build/web/*.js build/web/*.wasm build/web/*.pck
          ls -la build/web

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web/
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  # The server's half of the release: its tests and its compose file, checked
  # here so a broken signaling service stops a release like a failed export.
  server:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # The same checks every push touching server/ gets (server.yml): the
      # signaling tests, compose and Caddy, the bundle and the deploy
      # rehearsal, from the release the server is on now.
      - uses: ./.github/actions/server_checks
        with:
          previous: ${{ needs.plan.outputs.previous }}

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist/server.tar
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.mode == 'release' && 30 || 7 }}

  publish:
    needs: [plan, windows, macos, web, server]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # By name, not all of them: the web build and the server bundle are
      # this run's artifacts too, and are deployed rather than attached.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      # The in-game updater (ui/update/update_download.gd) refuses any file
      # whose SHA-256 is not on this list, so it is attached with the files.
      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Write release notes
        run: |
          {
            echo "## Download"
            echo
            echo "- **Windows**: \`TheNewHire-*-windows-setup.exe\` installs it (or take the portable \`.zip\`)."
            echo "  Windows may say *Windows protected your PC* - click **More info**, then **Run anyway**."
            echo "- **macOS**: open \`TheNewHire-*-macos.dmg\` and drag the game to Applications."
            echo "  The first time, macOS will refuse to open it: go to **System Settings -> Privacy & Security** and click **Open Anyway**."
            echo
            echo "Third-party components, their licences and where their source is: [CREDITS.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CREDITS.md)."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since $PREVIOUS"
              echo
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..HEAD"
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/$PREVIOUS...$TAG"
            else
              echo "## First release"
              echo
              echo "$(git rev-list --count HEAD) commits of history up to this point."
            fi
          } > notes.md
          cat notes.md
          ls -la dist

      - name: Publish the release
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file notes.md "${flags[@]}"

  # Only after the Release exists, so the site never runs a version nobody can
  # download. Its key can do nothing on the server but run server/deploy.sh,
  # which takes `server`, `web` or their dev twins and a tar on stdin
  # (server/README.md). If
  # this job fails the Release is still out: fix the cause and re-run the job.
  deploy:
    needs: [plan, publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://za-company.mayar-deeb.dev
    env:
      HOST: za-company.mayar-deeb.dev
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web

      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server-bundle

      - name: Load the deploy key
        # If this fails, the Release is out but the server is not updated.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash tools/release/load_deploy_key.sh

      - name: The server first
        # Signaling and the game change together (a PROTOCOL bump is both), so
        # the new game must never meet the old server.
        run: $SSH server < server-bundle/server.tar

      - name: Then the game
        run: tar -C web -cf - . | $SSH web

      - name: Check it is live
        run: |
          curl -fsS --retry 5 --retry-delay 3 "https://$HOST/healthz"
          curl -fsS "https://$HOST/" -o live.html
          cmp live.html web/index.html
          echo "::notice::v$VERSION is live at https://$HOST"

  # A deploy to dev, after every build worked: the Windows and macOS files
  # replace the rolling `dev` pre-release. One release, its files always named
  # `dev`, so each download link stays the same from one dev build to the next.
  # Marked pre-release and never latest, so GitHub's "latest" - which is what
  # the in-game update check asks for - is always the real release.
  publish-dev:
    needs: [plan, windows, macos, web, server]
    if: needs.plan.outputs.mode == 'dev'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      # The same list a release carries, so the in-game updater can be tried
      # against this build with --update-feed=<this release's API URL>.
      - name: Checksums
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Replace the dev pre-release
        run: |
          {
            echo "**Not a release.** A build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA:0:7}, for testing. The next dev deploy replaces it, and players are never offered it."
            echo
            echo "- Play it in a browser: https://dev.za-company.mayar-deeb.dev"
            echo "- Built $(date -u '+%Y-%m-%d %H:%M UTC'), last change: $(git log -1 --format='%s')"
            echo
            echo "The builds are not signed - see a release's notes for what Windows and macOS ask the first time."
          } > notes.md
          cat notes.md
          # Delete and recreate rather than edit: the tag must move to this
          # commit, and a release whose tag is gone is a draft nobody sees.
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          # And a tag a half-finished earlier run left behind, which `create`
          # would otherwise reuse - at the old commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" 2>/dev/null || true
          gh release create dev dist/* --target "$GITHUB_SHA" --title "dev build" \
            --notes-file notes.md --prerelease --latest=false

  # Then dev's own signaling and the web build onto the dev site, in the
  # release's order: the server first, so a new game never meets an old
  # service. `server-dev` starts ONLY the signaling service from this run's
  # copy of server/, as a project of its own on its own port (server/README.md,
  # Dev's signaling); `web-dev` fills the dev site's own folder. Neither can
  # touch the live site, its signaling, Caddy or coturn, which stay the latest
  # release's.
  deploy-dev:
    needs: [plan, publish-dev]
    if: needs.plan.outputs.mode == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: https://dev.za-company.mayar-deeb.dev
    env:
      HOST: za-company.mayar-deeb.dev
      DEV_SITE: https://dev.za-company.mayar-deeb.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web

      - uses: actions/download-artifact@v8
        with:
          name: server
          path: server-bundle

      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash tools/release/load_deploy_key.sh

      - name: Dev's signaling first
        run: $SSH server-dev < server-bundle/server.tar

      - name: Then the dev site
        run: tar -C web -cf - . | $SSH web-dev

      - name: Check it is live
        # "ok dev" and not merely "ok": the live service answers the same path,
        # and only the word proves the dev site reaches dev's own copy.
        run: |
          health=$(curl -fsS --retry 5 --retry-delay 3 "$DEV_SITE/healthz")
          [ "$health" = "ok dev" ] || { echo "::error::$DEV_SITE/healthz said '$health', not 'ok dev'"; exit 1; }
          curl -fsS "$DEV_SITE/" -o live.html
          cmp live.html web/index.html
          echo "::notice::${GITHUB_SHA:0:7} is live at $DEV_SITE, on dev's own signaling"
